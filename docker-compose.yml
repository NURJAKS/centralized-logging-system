services:
  db:
    image: postgres:15
    container_name: project_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jsoft_monitor
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: project_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./my-project
    container_name: project_backend
    ports:
      - "3005:3005"
    depends_on:
      - db
      - redis
    restart: on-failure
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/jsoft_monitor
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=jsoft_monitor
      - REDIS_URL=redis://redis:6379
      - PORT=3005
      - OPENAI_API_KEY=your_api_key_here

  frontend:
    build: ./jsoft-dashboard
    container_name: project_frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:3005

  test-client:
    build: ./jsoft-test-client
    container_name: project_test_client
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: on-failure
    environment:
      - BACKEND_URL=http://backend:3005
      - PORT=3001

volumes:
  postgres_data:
  redis_data:
